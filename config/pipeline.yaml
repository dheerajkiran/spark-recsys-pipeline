# Pipeline configuration. All paths, thresholds, labels and seeds live here.
# Values are starting points and will be tuned as each phase is built.

dataset:
  version: pure                  # pure | 1k | 27k
  local_dir: data/raw            # where scripts/download_data.sh extracts files
  hdfs_raw: hdfs:///raw/kuairand
  timezone: Asia/Shanghai        # KuaiRand times are Beijing time; event_date/hour use it
  # log_standard_* (recommender-served impressions) is the training source.
  # log_random_* (videos shown at random, is_rand=1) has a different exposure
  # distribution; it is kept aside as an optional unbiased evaluation set.
  use_random_log_for_eval: true

paths:
  bronze: hdfs:///bronze
  silver: hdfs:///silver
  features: hdfs:///features
  gold: hdfs:///gold
  metadata: hdfs:///gold/_metadata

label: is_click                  # is_click | long_view

split:
  # Time-based split by event date (YYYYMMDD), inclusive ranges.
  # Standard logs cover 2022-04-09 .. 2022-05-08 (30 days): 21 / 4 / 5 days.
  # Pure is front-loaded (Apr 10-12 are the busiest days), so by rows this is
  # roughly 88 / 6 / 6.
  # Boundaries are fixed here (not computed in stage 5) because vocabularies and
  # scaling statistics in stage 3 must be built from the training period only.
  train: [20220409, 20220429]
  val:   [20220430, 20220503]
  test:  [20220504, 20220508]

clean:
  max_watch_ratio: 5.0           # cap play_time_ms at this x duration_ms (p99.9 in Pure is 4.94)
  # Bot-like user-days are flagged on plausibility, not on a volume percentile:
  # in Pure the heaviest user-days are fast scrollers (15 s+ median gap), not bots.
  bot_min_events_per_day: 20
  bot_max_median_gap_seconds: 2.0
  bot_max_play_hours_per_day: 16
  max_removed_fraction: 0.10     # quality gate: fail if cleaning drops more

write:
  max_records_per_file: 2000000  # caps Parquet file size within a date partition

gold:
  # Files per split. Training shards files across DataLoader workers, so train
  # gets several; rows inside are in a deterministic pseudo-random order.
  files: {train: 8, val: 2, test: 2, test_random: 2}

features:
  history_length: 20             # last-N video ids per user
  # The history window looks back history_length + tie_slack rows and then drops
  # events at the current timestamp (same feed request). Same-timestamp groups
  # are at most 6 events in Pure.
  history_tie_slack: 10
  session_gap_minutes: 30
  min_count: 5                   # values seen fewer times in their source map to UNK
  # Click rates of videos/authors are smoothed toward the global click rate of
  # previous days, as if each had this many extra impressions at that rate.
  ctr_prior_strength: 20
  # Item statistics are computed from the logs per (video_id, date) and use
  # previous days only. video_features_statistic_*.csv is NOT used: its values
  # are monthly averages that include the val/test period (leakage).

join:
  # How to join item_daily on (video_id, event_date): broadcast | salted | sortmerge.
  # In Pure, item_daily is 3 MB and a 24-way shuffle by that key is balanced
  # (busiest partition 1.08x the median), so broadcast is best. Salting is for
  # when both sides are too large to broadcast (e.g. KuaiRand-27K).
  item_daily_strategy: broadcast
  salt_buckets: 8                # S for the salted strategy

quality:
  max_null_rate: 0.01
  label_rate_band: [0.20, 0.70]  # is_click is ~46% in Pure; warn if positive rate per split falls outside
  label_rate_band_random: [0.10, 0.30]  # random-log exposures: ~18% click rate in Pure

spark:
  shuffle_partitions: 24
  adaptive_enabled: true
  skew_join_enabled: true

seed: 42

# CPU training on locally exported gold. These settings do not require Docker.
# Paths here are relative to the repository; --run-dir selects one output run.
training:
  gold_dir: data/gold
  output_dir: checkpoints
  model: deepfm
  epochs: 20
  batch_size: 4096
  learning_rate: 0.001
  patience: 3
  embedding_dim: 16
  hidden_dims: [128, 64]
  dropout: 0.0
  num_workers: 0
  threads: 2
  evaluate_test: false           # enable explicitly only for a final model run
