# Local HDFS + Spark cluster. See README section 6 for sizing.

x-hadoop: &hadoop
  build: ./docker/hadoop
  image: recsys/hadoop:3.3.6
  environment:
    HADOOP_HEAPSIZE_MAX: 768m
  mem_limit: 1g
  restart: unless-stopped

services:
  namenode:
    <<: *hadoop
    container_name: namenode
    hostname: namenode
    command: ["namenode"]
    ports:
      - "9870:9870"   # web UI
      - "9000:9000"   # RPC
    volumes:
      - namenode:/hadoop/dfs/name
      - ./data/raw:/data/raw:ro   # local downloads, for scripts/load_to_hdfs.sh
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9870/"]
      interval: 10s
      timeout: 5s
      retries: 12

  datanode-1:
    <<: *hadoop
    container_name: datanode-1
    hostname: datanode-1
    command: ["datanode"]
    ports:
      - "9864:9864"   # web UI
    volumes:
      - datanode-1:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9864/"]
      interval: 10s
      timeout: 5s
      retries: 12

  datanode-2:
    <<: *hadoop
    container_name: datanode-2
    hostname: datanode-2
    command: ["datanode"]
    ports:
      - "9865:9864"   # web UI
    volumes:
      - datanode-2:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9864/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  namenode:
  datanode-1:
  datanode-2:
