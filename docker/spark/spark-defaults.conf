# Defaults for every spark-submit on this cluster. See README section 6.

spark.master                               spark://spark-master:7077

# HDFS. Spark's Hadoop client does not read our hdfs-site.xml, so set the
# client-side replication too; otherwise files are written with the default of
# 3 and stay under-replicated on a 2-datanode cluster.
spark.hadoop.fs.defaultFS                  hdfs://namenode:9000
spark.hadoop.dfs.replication               2

# Resources: one executor per worker (2 cores, 1 GB heap + 384 MB overhead
# fits the 1600 MB each worker offers). The driver runs in the spark-master
# container (client mode), so keep it small.
spark.executor.cores                       2
spark.executor.memory                      1g
spark.driver.memory                        768m

# Query execution
spark.sql.adaptive.enabled                 true
spark.sql.adaptive.skewJoin.enabled        true
spark.sql.shuffle.partitions               24
spark.serializer                           org.apache.spark.serializer.KryoSerializer

# Event logs feed the History Server (shared volume between master and history).
spark.eventLog.enabled                     true
spark.eventLog.dir                         file:/opt/spark/spark-events
spark.history.fs.logDirectory              file:/opt/spark/spark-events
